# Postgres 16 — docker compose
#
#   docker compose up -d          start (creates the volume + runs init/*.sql on first run)
#   docker compose ps             check health
#   docker compose logs -f db     tail logs
#   docker compose down            stop (keeps data)
#   docker compose down -v         stop and DELETE data
#
# Connection:  postgresql://auction:auction@localhost:5432/auctionhistory

name: auctionhistory

services:
  db:
    image: postgres:16-alpine          # swap to postgres:17 for the Debian image + more extensions
    container_name: auctionhistory-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-auction}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-auction}
      POSTGRES_DB: ${POSTGRES_DB:-finalbid}
      # deterministic collation/encoding
      POSTGRES_INITDB_ARGS: "--encoding=UTF8 --locale=C.UTF-8"
      TZ: ${TZ:-UTC}
      PGTZ: ${TZ:-UTC}
    ports:
      # Host 5432 is already occupied by a native Windows Postgres, so the
      # container is published on 5433. Override with POSTGRES_PORT if needed.
      - "${POSTGRES_PORT:-5433}:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      # *.sql / *.sh here run once, only when the data volume is first created
      - ./init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-auction} -d ${POSTGRES_DB:-auctionhistory}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s
    shm_size: 256mb
    # Sensible defaults for light/medium workloads. Raise shared_buffers to ~25% of RAM.
    command:
      - postgres
      - -c
      - max_connections=100
      - -c
      - shared_buffers=256MB
      - -c
      - effective_cache_size=768MB
      - -c
      - work_mem=8MB
      - -c
      - maintenance_work_mem=128MB
      - -c
      - random_page_cost=1.1           # SSD-friendly

volumes:
  pgdata:
    name: auctionhistory-pgdata
